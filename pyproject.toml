[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechavision-ai"
version = "0.1.0"
description = "Bộ công cụ nghiên cứu ước lượng chuyển động tay quay–con trượt phẳng bằng thị giác có ràng buộc vật lý"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{name = "MechaVision AI Research Project"}]
dependencies = ["numpy>=1.26,<3", "opencv-contrib-python>=4.8,<5", "Pillow>=10,<14"]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7", "pyqtgraph>=0.13,<1"]
train = ["ultralytics>=8.3,<9", "torch>=2.2", "PyYAML>=6"]
dev = ["pytest>=8", "ruff>=0.8"]
all = ["PySide6>=6.6,<7", "pyqtgraph>=0.13,<1", "ultralytics>=8.3,<9", "torch>=2.2", "PyYAML>=6", "pytest>=8", "ruff>=0.8"]

[project.scripts]
mechavision = "mechavision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
