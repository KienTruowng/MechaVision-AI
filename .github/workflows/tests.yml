name: Kiểm thử
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cài thư viện hệ thống cho Qt và OpenCV
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 fonts-dejavu-core
      - run: python -m pip install -e ".[gui,dev]"
      - name: Kiểm tra import GUI
        run: python -c "from PySide6.QtWidgets import QApplication; import pyqtgraph; app = QApplication([])"
      - name: Ghi môi trường native
        run: |
          mkdir -p ci-logs
          python -m pip freeze > ci-logs/dependencies.txt
          python tools/diagnose_native.py > ci-logs/native.txt 2>&1
      - name: Toàn bộ kiểm thử với stack trace
        id: suite
        shell: bash
        run: |
          set -o pipefail
          python -X faulthandler -m pytest -vv -s -o addopts='' -o faulthandler_timeout=60 --junitxml=ci-logs/results.xml 2>&1 | tee ci-logs/pytest.txt
      - name: Khoanh vùng crash Python 3.11 khi suite lỗi
        if: failure() && steps.suite.outcome == 'failure' && matrix.python-version == '3.11'
        shell: bash
        env:
          QT_DEBUG_PLUGINS: '1'
        run: |
          set +e
          status=0
          for group in picker dashboard pipeline; do
            case "$group" in
              picker) files="tests/test_dashboard_v2.py::test_geometry_file_picker_interaction" ;;
              dashboard) files="tests/test_dashboard_v2.py" ;;
              pipeline) files="tests/test_phase2_pipeline.py tests/test_phase21_readiness.py" ;;
            esac
            timeout 180s python -X faulthandler -m pytest -vv -s -o addopts='' -o faulthandler_timeout=60 $files > "ci-logs/$group.txt" 2>&1
            rc=$?
            echo "$group exit=$rc" | tee -a ci-logs/group-status.txt
            if [ "$rc" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Lưu bằng chứng CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-python-${{ matrix.python-version }}
          path: ci-logs/
          retention-days: 7
      - run: python -m compileall -q src
