name: Kiểm thử

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cài thư viện hệ thống cho Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 fonts-dejavu-core

      - name: Cài Python dependencies với OpenCV headless
        run: |
          python -m pip install -e ".[gui,dev]"
          python -m pip uninstall -y opencv-contrib-python
          python -m pip install opencv-contrib-python-headless==4.14.0.94
          python -c "import cv2; print('OpenCV:', cv2.__version__)"

      - name: Kiểm tra GUI
        run: |
          python -c "from PySide6.QtWidgets import QApplication; import pyqtgraph; app = QApplication([])"

      - name: Ghi môi trường native
        run: |
          mkdir -p ci-logs
          python -m pip freeze > ci-logs/dependencies.txt
          python tools/diagnose_native.py > ci-logs/native.txt 2>&1

      - name: Chạy toàn bộ kiểm thử
        shell: bash
        run: |
          set -o pipefail
          python -X faulthandler -m pytest -vv -s -o addopts='' --junitxml=ci-logs/results.xml 2>&1 | tee ci-logs/pytest.txt
      - name: Khoanh vùng crash Python 3.11
        if: failure() && matrix.python-version == '3.11'
        shell: bash
        run: |
          set +e
          for group in picker dashboard pipeline; do
            case "$group" in
              picker) files="tests/test_dashboard_v2.py::test_geometry_file_picker_interaction" ;;
              dashboard) files="tests/test_dashboard_v2.py" ;;
              pipeline) files="tests/test_phase2_pipeline.py tests/test_phase21_readiness.py" ;;
            esac
            timeout 180s python -X faulthandler -m pytest -vv -s -o addopts='' $files > "ci-logs/$group.txt" 2>&1
            echo "$group exit=$?" | tee -a ci-logs/group-status.txt
          done
      - name: Lưu log kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-python-${{ matrix.python-version }}
          path: ci-logs/
          retention-days: 7

      - name: Kiểm tra cú pháp Python
        run: python -m compileall -q src